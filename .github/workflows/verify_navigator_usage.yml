name: Search for 'Navigator'

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Search for 'Navigator' (case-insensitive)
        id: search_results
        run: |
          echo "Searching for 'Navigator' (case-insensitive) in all code files..."

          grep -riwn "Navigator" . | awk -F':' '{print $1 " - line:" $2}' > found_files_with_lines.txt || true

          grep -rilw "Navigator" . | tr '\n' ' ' > simple_found_files.txt || true

          if [ -s found_files_with_lines.txt ]; then
            echo "::warning title=Found 'Navigator'::The word 'Navigator' was found in the following files:"
            echo "files_found_list<<EOF" >> "$GITHUB_OUTPUT"
            while IFS= read -r line; do
              echo "* $line" >> "$GITHUB_OUTPUT"
            done < found_files_with_lines.txt
            echo "EOF" >> "$GITHUB_OUTPUT"

            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "files_found=$(cat simple_found_files.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "The word 'Navigator' was not found in any files."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Display search results
        if: steps.search_results.outputs.found == 'true'
        run: |
          echo "::group::Files where 'Navigator' was found"
          echo "${{ steps.search_results.outputs.files_found_list }}"
          echo "::endgroup::"
        shell: bash

      - name: Fail build if 'Navigator' is found
        if: steps.search_results.outputs.found == 'true'
        run: |
          echo "Error: The word 'Navigator' was found in the codebase. Failing the build."
          exit 1
        shell: bash